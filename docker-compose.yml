services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beautypay}
      POSTGRES_USER: ${POSTGRES_USER:-beautypay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beautypay}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beautypay} -d ${POSTGRES_DB:-beautypay}"]
      interval: 5s
      timeout: 5s
      retries: 20

  cms:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,cms}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:8000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-beautypay}:${POSTGRES_PASSWORD:-beautypay}@db:5432/${POSTGRES_DB:-beautypay}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - cms_media:/app/media
    command: >-
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --reload"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/cms/healthcheck/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: .
      args:
        CMS_API_URL: http://cms:8000/api/cms
    restart: unless-stopped
    environment:
      CMS_ENABLED: ${CMS_ENABLED:-1}
      CMS_API_URL: http://cms:8000/api/cms
      CMS_LANGUAGE: ${CMS_LANGUAGE:-fa}
      CMS_REVALIDATE_SECONDS: ${CMS_REVALIDATE_SECONDS:-30}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      cms:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  cms_media:
